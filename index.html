<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Stores</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#111}
header{background:#0a7d3b;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header a.logo{color:#fff;text-decoration:none;font-weight:800;font-size:19px}
.pill{background:#fff;color:#0a7d3b;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:20px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
button,.btn{background:#0a7d3b;color:#fff;border:0;padding:12px 16px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;margin:2px 0}
.btn.alt,button.alt{background:#e6e6e6;color:#111}
.btn.wa{background:#25d366}
button.del{background:#c62828;padding:6px 10px;font-size:13px}
button:disabled{opacity:.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#666;font-size:14px}
.err{color:#c62828;font-size:14px;min-height:18px}
.link{word-break:break-all;background:#eef7f1;padding:10px;border-radius:8px;font-size:14px}
.search{border-radius:24px;padding:12px 16px;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{background:#fff;color:#111;border:1px solid #ddd;border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap;margin:0}
.chip.on{background:#0a7d3b;color:#fff;border-color:#0a7d3b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:#fff;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px #0001;display:block}
.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e9ecef}
.pi{padding:8px 10px}
.pr{color:#0a7d3b;font-weight:800}
.pn{font-size:14px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font-size:12px;color:#777}
.big{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:12px;display:block}
.pc{position:relative}
.bd{position:absolute;top:6px;right:6px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;background:#000}
.gal img{flex:0 0 100%;width:100%;max-height:420px;object-fit:contain;scroll-snap-align:center}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:0 0 auto;cursor:pointer}
.previews{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.pv{position:relative;width:76px;height:76px}
.pv img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pv .x{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border:0;border-radius:50%;width:22px;height:22px;padding:0;font-size:14px;line-height:22px;margin:0}
</style>
</head>
<body>
<header><a class="logo" href="./">Campus Stores</a><span id="nav"></span></header>
<main id="app">Loading...</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyABVchOctQoK2u8U7Hu2r7Y8fMiWJRg_CY",
  authDomain: "campus-stores-2b01d.firebaseapp.com",
  projectId: "campus-stores-2b01d",
  storageBucket: "campus-stores-2b01d.firebasestorage.app",
  messagingSenderId: "464591723954",
  appId: "1:464591723954:web:ce2ab6fb86e7887ebe98ab"
};
const CLOUD = "ghqv22zf", PRESET = "campus_unsigned";
const CATS = ["Food", "Fashion", "Gadgets", "Beauty", "Services", "Other"];

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const $ = s => document.querySelector(s);
const app = $("#app");
const P = new URLSearchParams(location.search);
const baseUrl = location.origin + location.pathname;
let me = null;

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString();
const waNum = n => { n = String(n).replace(/\D/g, ""); if (n.startsWith("0")) n = "234" + n.slice(1); return n; };
const slugify = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const okImg = u => typeof u === "string" && u.startsWith("https://res.cloudinary.com/");
const thumb = u => okImg(u) ? u.replace("/upload/", "/upload/w_400,h_400,c_fill,q_auto,f_auto/") : "";
const bigImg = u => okImg(u) ? u.replace("/upload/", "/upload/w_900,q_auto,f_auto/") : "";
const byNew = (a, b) => (b.createdAt?.seconds || 9e12) - (a.createdAt?.seconds || 9e12);

async function compress(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.8));
}
async function uploadImage(file) {
  const fd = new FormData();
  fd.append("file", await compress(file));
  fd.append("upload_preset", PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`, { method: "POST", body: fd });
  const j = await r.json();
  if (!j.secure_url) throw new Error(j.error?.message || "Upload failed");
  return j.secure_url;
}

const card = p => `<a class="pc" href="?p=${encodeURIComponent(p.id)}">
  ${okImg(p.imageUrl) ? `<img loading="lazy" src="${esc(thumb(p.imageUrl))}" alt="">` : '<div class="ph"></div>'}
  ${(p.images?.length || 0) > 1 ? `<span class="bd">📷 ${p.images.length}</span>` : ""}
  <div class="pi"><div class="pr">₦${esc(fmt(p.price))}</div><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.storeName || "")}</div></div></a>`;

onAuthStateChanged(auth, u => {
  me = u;
  $("#nav").innerHTML = `<a class="pill" href="?a=1">${u ? "My store" : "Sell / Login"}</a>`;
  route();
});

function route() {
  if (P.get("p")) return showProduct(P.get("p"));
  if (P.get("s")) return showStore(P.get("s"));
  if (P.get("a")) return showAccount();
  showHome();
}

/* ---------- HOME ---------- */
async function showHome() {
  app.innerHTML = `<input id="q" class="search" placeholder="Search products in Nsukka...">
    <div class="chips" id="chips"></div><div id="grid" class="grid">Loading...</div>`;
  let items = [], cat = "All";
  const draw = () => {
    const q = $("#q").value.toLowerCase().trim();
    const list = items.filter(p => (cat === "All" || p.category === cat) && (!q || (p.name + " " + (p.storeName || "")).toLowerCase().includes(q)));
    $("#grid").innerHTML = list.length ? list.map(card).join("") : '<p class="muted">No products found yet.</p>';
  };
  const chips = () => {
    $("#chips").innerHTML = ["All", ...CATS].map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cat = b.dataset.c; chips(); draw(); });
  };
  chips();
  $("#q").oninput = draw;
  try {
    const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc"), limit(80)));
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    draw();
  } catch (e) { $("#grid").innerHTML = '<p class="err">Could not load products. Check your network.</p>'; }
}

/* ---------- PRODUCT ---------- */
async function showProduct(id) {
  const ps = await getDoc(doc(db, "products", id));
  if (!ps.exists()) { app.innerHTML = '<div class="card">Product not found. <a href="./">Go home</a></div>'; return; }
  const p = ps.data();
  const ss = await getDoc(doc(db, "stores", p.storeId));
  const s = ss.exists() ? ss.data() : {};
  const msg = encodeURIComponent(`Hello ${s.name || ""}, I want to order: ${p.name} (₦${fmt(p.price)}). I saw it on Campus Stores.`);
  document.title = p.name + " | Campus Stores";
  const imgs = (Array.isArray(p.images) && p.images.length ? p.images : [p.imageUrl]).filter(okImg);
  app.innerHTML = `<p><a href="./">← Back</a></p>
    ${imgs.length ? `<div class="gal" id="gal">${imgs.map(u => `<img src="${esc(bigImg(u))}" alt="">`).join("")}</div>
    ${imgs.length > 1 ? `<div class="muted" id="cnt" style="text-align:center;margin-top:6px">1 / ${imgs.length} · swipe for more</div><div class="thumbs">${imgs.map((u, i) => `<img data-i="${i}" src="${esc(thumb(u))}" alt="">`).join("")}</div>` : ""}` : ""}
    <div class="card" style="margin-top:10px">
      <div class="pr" style="font-size:22px">₦${esc(fmt(p.price))}</div>
      <h2 style="margin:4px 0">${esc(p.name)}</h2>
      <p class="muted">${esc(p.category || "")} · Nsukka</p>
      <p>${esc(p.desc)}</p>
      ${s.whatsapp ? `<a class="btn wa" href="https://wa.me/${waNum(s.whatsapp)}?text=${msg}">Order on WhatsApp</a>
      <a class="btn alt" href="tel:+${waNum(s.whatsapp)}">Call</a>` : ""}
    </div>
    ${s.slug ? `<a href="?s=${encodeURIComponent(s.slug)}" style="text-decoration:none;color:inherit"><div class="card"><b>Seller: ${esc(s.name)}</b><div class="muted">See all products from this store →</div></div></a>` : ""}`;
  const gal = $("#gal");
  if (gal && imgs.length > 1) {
    gal.onscroll = () => { $("#cnt").textContent = (Math.round(gal.scrollLeft / gal.clientWidth) + 1) + " / " + imgs.length + " · swipe for more"; };
    document.querySelectorAll(".thumbs img").forEach(t => t.onclick = () => gal.scrollTo({ left: Number(t.dataset.i) * gal.clientWidth, behavior: "smooth" }));
  }
}

/* ---------- STORE ---------- */
async function showStore(slug) {
  const q = await getDocs(query(collection(db, "stores"), where("slug", "==", slug)));
  if (q.empty) { app.innerHTML = '<div class="card">Store not found. <a href="./">Go home</a></div>'; return; }
  const st = q.docs[0], d = st.data();
  const ps = await getDocs(query(collection(db, "products"), where("storeId", "==", st.id)));
  const items = ps.docs.map(x => ({ id: x.id, ...x.data() })).sort(byNew);
  document.title = d.name + " | Campus Stores";
  app.innerHTML = `<p><a href="./">← Back</a></p>
    <div class="card"><h2 style="margin:0">${esc(d.name)}</h2><p class="muted">${esc(d.category)} · Nsukka</p>
    <a class="btn wa" href="https://wa.me/${waNum(d.whatsapp)}">Chat on WhatsApp</a></div>
    <div class="grid">${items.length ? items.map(card).join("") : '<p class="muted">No products yet.</p>'}</div>`;
}

/* ---------- ACCOUNT ---------- */
function showAccount() {
  if (!me) return authForm();
  showDash(me);
}

function authForm() {
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">Sell on Campus Stores</h2>
    <p class="muted">Create a free account to open your store and get a link to share on WhatsApp.</p>
    <input id="em" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password (6+ characters)">
    <p class="err" id="err"></p>
    <button id="su">Create account</button> <button class="alt" id="li">Log in</button></div>`;
  const go = fn => async () => {
    try { await fn(auth, $("#em").value.trim(), $("#pw").value); }
    catch (e) { $("#err").textContent = (e.code || "error").replace("auth/", "").replace(/-/g, " "); }
  };
  $("#su").onclick = go(createUserWithEmailAndPassword);
  $("#li").onclick = go(signInWithEmailAndPassword);
}

async function showDash(user) {
  const ref = doc(db, "stores", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    app.innerHTML = `<div class="card"><h2 style="margin-top:0">Create your store</h2>
      <input id="sn" placeholder="Store name (e.g. Mama Put Kitchen)">
      <select id="sc">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
      <input id="sw" type="tel" placeholder="WhatsApp number (e.g. 08012345678)">
      <p class="err" id="err"></p>
      <button id="cs">Create store</button></div>`;
    $("#cs").onclick = async () => {
      const name = $("#sn").value.trim(), whatsapp = $("#sw").value.trim();
      if (!name || waNum(whatsapp).length < 11) { $("#err").textContent = "Enter store name and a correct WhatsApp number"; return; }
      let slug = slugify(name) || "store";
      const taken = await getDocs(query(collection(db, "stores"), where("slug", "==", slug)));
      if (!taken.empty) slug += "-" + Math.floor(100 + Math.random() * 900);
      await setDoc(ref, { name, slug, whatsapp, category: $("#sc").value, ownerId: user.uid, createdAt: serverTimestamp() });
      showDash(user);
    };
    return;
  }
  const d = snap.data();
  const link = baseUrl + "?s=" + d.slug;
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">${esc(d.name)}</h2>
    <p class="muted">Your store link. Share am on WhatsApp status:</p>
    <div class="link">${esc(link)}</div><br>
    <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent("Shop with " + d.name + " here: " + link)}">Share on WhatsApp</a>
    <a class="btn alt" href="${esc(link)}">View store</a></div>
    <div class="card"><h3 style="margin-top:0">Add a product</h3>
    <input id="pf" type="file" accept="image/*" multiple>
    <p class="muted" id="pcount"></p>
    <div class="previews" id="prevs"></div>
    <input id="pn" placeholder="Product name">
    <input id="pp" type="number" inputmode="numeric" placeholder="Price in Naira (e.g. 1500)">
    <select id="pc">${CATS.map(c => `<option ${c === d.category ? "selected" : ""}>${c}</option>`).join("")}</select>
    <textarea id="pd" rows="2" placeholder="Short description"></textarea>
    <p class="err" id="perr"></p>
    <button id="ap">Add product</button></div>
    <h3>Your products</h3><div id="plist">Loading...</div>
    <p><button class="alt" id="lo">Log out</button></p>`;
  $("#lo").onclick = () => signOut(auth).then(() => { location.href = baseUrl; });
  let files = [];
  const drawPrev = () => {
    $("#prevs").innerHTML = files.map((f, i) => `<div class="pv"><img src="${URL.createObjectURL(f)}" alt=""><button class="x" data-i="${i}">×</button></div>`).join("");
    $("#pcount").textContent = files.length ? `${files.length}/10 photos (first one na the main photo)` : "Add up to 10 photos. You fit select many at once.";
    document.querySelectorAll(".x").forEach(b => b.onclick = () => { files.splice(Number(b.dataset.i), 1); drawPrev(); });
  };
  drawPrev();
  $("#pf").onchange = () => {
    files = files.concat([...$("#pf").files]).slice(0, 10);
    $("#pf").value = "";
    drawPrev();
  };
  $("#ap").onclick = async () => {
    const name = $("#pn").value.trim(), price = Number($("#pp").value), desc = $("#pd").value.trim();
    if (!files.length) { $("#perr").textContent = "Add at least one photo"; return; }
    if (!name || !price) { $("#perr").textContent = "Enter product name and price"; return; }
    const btn = $("#ap"); btn.disabled = true; $("#perr").textContent = "";
    try {
      const images = [];
      for (let i = 0; i < files.length; i++) {
        btn.textContent = `Uploading ${i + 1}/${files.length}...`;
        images.push(await uploadImage(files[i]));
      }
      await addDoc(collection(db, "products"), { storeId: user.uid, storeName: d.name, category: $("#pc").value, name, price, desc, imageUrl: images[0], images, createdAt: serverTimestamp() });
      $("#pn").value = $("#pp").value = $("#pd").value = ""; files = []; drawPrev();
      loadProducts(user);
    } catch (e) { $("#perr").textContent = "Failed: " + (e.message || "try again"); }
    btn.disabled = false; btn.textContent = "Add product";
  };
  loadProducts(user);
}

async function loadProducts(user) {
  const ps = await getDocs(query(collection(db, "products"), where("storeId", "==", user.uid)));
  const items = ps.docs.map(x => ({ id: x.id, ...x.data() })).sort(byNew);
  $("#plist").innerHTML = items.length ? items.map(p => `<div class="card row"><div style="display:flex;gap:10px;align-items:center">
    ${okImg(p.imageUrl) ? `<img src="${esc(thumb(p.imageUrl))}" style="width:56px;height:56px;object-fit:cover;border-radius:8px" alt="">` : ""}
    <div><b>${esc(p.name)}</b><div class="pr">₦${esc(fmt(p.price))}</div></div></div>
    <button class="del" data-id="${p.id}">Delete</button></div>`).join("") : '<p class="muted">No products yet.</p>';
  document.querySelectorAll(".del").forEach(b => b.onclick = async () => {
    if (confirm("Delete this product?")) { await deleteDoc(doc(db, "products", b.dataset.id)); loadProducts(user); }
  });
}
</script>
</body>
</html>
